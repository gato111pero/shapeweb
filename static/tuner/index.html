<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉他调音器 - Guitar Tuner</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e0e0e0;
            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .tuner-card {
            background: var(--surface);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-weight: 400;
            letter-spacing: 0.1rem;
            margin-bottom: 0.25rem;
            font-size: 2rem;
        }
        .note-display {
            font-size: 5rem;
            font-weight: 700;
            margin: 0.5rem 0;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .note-display.in-tune {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            -webkit-background-clip: text;
            background-clip: text;
        }
        .frequency {
            font-size: 1.2rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
            min-height: 1.5rem;
        }
        .meter {
            height: 1.2rem;
            background: #2c3e50;
            border-radius: 1rem;
            overflow: hidden;
            margin: 1rem 0 1.5rem;
            position: relative;
        }
        .meter-fill {
            height: 100%;
            width: 50%;
            background: var(--accent);
            border-radius: 1rem;
            transition: width 0.1s ease-out, background 0.3s;
        }
        .meter.fine .meter-fill { background: var(--success); }
        .meter.flat .meter-fill { background: #e67e22; }
        .meter.sharp .meter-fill { background: #e74c3c; }
        .meter-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: -0.8rem;
            margin-bottom: 1rem;
            padding: 0 0.2rem;
        }
        .strings {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 1rem;
        }
        .string-btn {
            background: #2c3e50;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.4rem 0.7rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 3rem;
        }
        .string-btn:hover { background: #3d566e; }
        .string-btn.active {
            background: var(--accent);
            color: #1a1a2e;
            transform: scale(1.1);
        }
        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
            min-height: 1.2rem;
        }
        button {
            background: #2c3e50;
            border: none;
            color: white;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.3rem;
            transition: background 0.2s;
        }
        button:hover { background: #3d566e; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.primary { background: var(--accent); color: #1a1a2e; font-weight: bold; }
        button.primary:hover { background: #f1c40f; }

        .error-hint {
            display: none;
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(231,76,60,0.15);
            border: 1px solid rgba(231,76,60,0.3);
            border-radius: 0.8rem;
            font-size: 0.85rem;
            line-height: 1.5;
            text-align: left;
        }
        .error-hint.show { display: block; }
        .error-hint code {
            background: rgba(255,255,255,0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 0.2rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text);
            opacity: 0.5;
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="tuner-card">
        <h1>🎸 吉他调音器</h1>
        <div class="note-display" id="noteText">--</div>
        <div class="frequency" id="freqText">等待麦克风权限…</div>
        <div class="meter" id="meterContainer">
            <div class="meter-fill" id="meterFill" style="width:50%"></div>
        </div>
        <div class="meter-labels">
            <span>◀ 偏低</span><span>✓ 准</span><span>偏高 ▶</span>
        </div>
        <div class="strings" id="stringButtons"></div>
        <div class="status" id="statusText">点击下方按钮开始</div>
        <div>
            <button id="startBtn" class="primary">🎤 开始监听</button>
            <button id="stopBtn" disabled>⏹️ 停止</button>
        </div>
        <div class="error-hint" id="errorHint"></div>
        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
    (function() {
        // ============ 吉他标准调弦 ============
        const STRINGS = [
            { name: 'E2', freq: 82.41,  label: '⑥ 低E' },
            { name: 'A2', freq: 110.00, label: '⑤ A' },
            { name: 'D3', freq: 146.83, label: '④ D' },
            { name: 'G3', freq: 196.00, label: '③ G' },
            { name: 'B3', freq: 246.94, label: '② B' },
            { name: 'E4', freq: 329.63, label: '① 高E' }
        ];

        let audioCtx = null;
        let stream = null;
        let animFrame = null;
        let selectedString = STRINGS[0];

        // ============ DOM 元素 ============
        const noteText    = document.getElementById('noteText');
        const freqText    = document.getElementById('freqText');
        const meterFill   = document.getElementById('meterFill');
        const meterContainer = document.getElementById('meterContainer');
        const statusText  = document.getElementById('statusText');
        const startBtn    = document.getElementById('startBtn');
        const stopBtn     = document.getElementById('stopBtn');
        const stringBtns  = document.getElementById('stringButtons');
        const errorHint   = document.getElementById('errorHint');

        // ============ 琴弦选择按钮 ============
        STRINGS.forEach((s, idx) => {
            const btn = document.createElement('button');
            btn.className = 'string-btn' + (idx === 0 ? ' active' : '');
            btn.textContent = s.name;
            btn.title = s.label + ' · ' + s.freq.toFixed(2) + ' Hz';
            btn.addEventListener('click', () => {
                document.querySelectorAll('.string-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedString = STRINGS[idx];
            });
            stringBtns.appendChild(btn);
        });

        // ============ 内置音高检测 (自相关算法 ACF2+) ============
        function detectPitch(buf, sampleRate) {
            const SIZE = buf.length;

            // 计算 RMS 检查信号强度
            let rms = 0;
            for (let i = 0; i < SIZE; i++) {
                rms += buf[i] * buf[i];
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return { pitch: -1, clarity: 0 };

            // 裁剪静音尾部，缩小计算范围
            const thres = 0.2;
            let r1 = 0, r2 = SIZE - 1;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            const trimmed = buf.slice(r1, r2);
            const N = trimmed.length;
            if (N < 100) return { pitch: -1, clarity: 0 };

            // 自相关
            const corr = new Float32Array(N);
            for (let i = 0; i < N; i++) {
                let sum = 0;
                for (let j = 0; j < N - i; j++) {
                    sum += trimmed[j] * trimmed[j + i];
                }
                corr[i] = sum;
            }

            // 找第一个谷底之后的峰值
            let d = 0;
            while (d < N - 1 && corr[d] > corr[d + 1]) d++;

            let maxVal = -1, maxPos = -1;
            for (let i = d; i < N; i++) {
                if (corr[i] > maxVal) {
                    maxVal = corr[i];
                    maxPos = i;
                }
            }

            if (maxPos <= 0) return { pitch: -1, clarity: 0 };

            // 抛物线插值提高精度
            let T0 = maxPos;
            if (maxPos > 0 && maxPos < N - 1) {
                const x1 = corr[maxPos - 1];
                const x2 = corr[maxPos];
                const x3 = corr[maxPos + 1];
                const a = (x1 + x3 - 2 * x2) / 2;
                const b = (x3 - x1) / 2;
                if (Math.abs(a) > 1e-9) T0 = maxPos - b / (2 * a);
            }

            // 避免检测到过高频率（噪声）
            const pitch = sampleRate / T0;
            if (pitch < 60 || pitch > 1200) return { pitch: -1, clarity: 0 };

            // 用归一化自相关峰值作为清晰度
            const clarity = Math.min(1, maxVal / corr[0]);
            return { pitch, clarity };
        }

        // ============ 音符计算 ============
        function getClosestNote(freq) {
            if (!freq || freq <= 0) return null;
            const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const A4 = 440;
            const C0 = A4 * Math.pow(2, -4.75);
            const halfSteps = Math.round(12 * Math.log2(freq / C0));
            const noteFreq = C0 * Math.pow(2, halfSteps / 12);
            const noteIndex = ((halfSteps % 12) + 12) % 12;
            const octave = Math.floor(halfSteps / 12);
            const noteName = noteNames[noteIndex] + octave;
            const cents = 1200 * Math.log2(freq / noteFreq);
            return { noteName, noteFreq, cents, noteIndex };
        }

        function centsToPercent(cents) {
            let val = (cents + 50) / 100 * 100;
            return Math.max(0, Math.min(100, val));
        }

        // ============ 错误提示 ============
        function showError(type, detail) {
            errorHint.classList.add('show');
            let msg = '';
            switch (type) {
                case 'not-secure':
                    msg = `⚠️ <b>需要安全连接</b><br>
                        麦克风只能在 HTTPS 或 localhost 下使用。<br>
                        当前页面: <code>${location.protocol}</code><br>
                        请使用 <code>https://</code> 访问本站，或在本地使用 <code>http://localhost</code> 开发。`;
                    break;
                case 'not-supported':
                    msg = `⚠️ <b>浏览器不支持麦克风</b><br>
                        请使用现代浏览器（Chrome、Edge、Firefox、Safari）打开此页面。<br>
                        旧版浏览器或部分嵌入式浏览器可能不支持麦克风 API。`;
                    break;
                case 'permission-denied':
                    msg = `⚠️ <b>麦克风权限被拒绝</b><br>
                        请点击浏览器地址栏左侧的锁/信息图标，开启麦克风权限，然后刷新页面重试。<br>
                        错误信息: ${detail || ''}`;
                    break;
                case 'not-found':
                    msg = `⚠️ <b>未检测到麦克风设备</b><br>
                        请检查电脑是否连接了麦克风（内置或外接），并在系统设置中确认麦克风未被禁用。`;
                    break;
                case 'abort':
                    msg = `⚠️ <b>麦克风请求被中断</b><br>
                        操作被取消，请重试。`;
                    break;
                default:
                    msg = `⚠️ <b>无法获取麦克风</b><br>
                        错误: ${detail || '未知原因'}<br>
                        请检查浏览器和系统麦克风设置。`;
            }
            errorHint.innerHTML = msg;
        }

        function hideError() {
            errorHint.classList.remove('show');
        }

        // ============ 麦克风监听 ============
        async function startListening() {
            hideError();

            // 检查安全上下文
            if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                showError('not-secure');
                statusText.textContent = '需要 HTTPS 连接';
                return;
            }

            // 检查 API 支持
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError('not-supported');
                statusText.textContent = '浏览器不支持麦克风';
                return;
            }

            if (audioCtx) await stopListening();

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtxClass();

                // 某些浏览器需要 resume
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const source = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;
                source.connect(analyser);

                const bufferSize = analyser.fftSize;
                const inputArray = new Float32Array(bufferSize);

                statusText.textContent = '🎵 正在倾听…请弹奏琴弦';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                hideError();

                let lowSignalCount = 0;

                function update() {
                    analyser.getFloatTimeDomainData(inputArray);
                    const result = detectPitch(inputArray, audioCtx.sampleRate);

                    if (result.pitch > 0 && result.clarity > 0.7) {
                        lowSignalCount = 0;
                        const pitch = result.pitch;
                        const note = getClosestNote(pitch);
                        if (note) {
                            noteText.textContent = note.noteName;
                            freqText.textContent = `${pitch.toFixed(1)} Hz  |  偏差: ${note.cents.toFixed(0)} 音分`;

                            const percent = centsToPercent(note.cents);
                            meterFill.style.width = percent + '%';

                            // 更新 meter 颜色类
                            meterContainer.classList.remove('fine', 'flat', 'sharp');
                            if (Math.abs(note.cents) < 5) {
                                meterContainer.classList.add('fine');
                                noteText.classList.add('in-tune');
                                const isNearSelected = Math.abs(pitch - selectedString.freq) < selectedString.freq * 0.08;
                                statusText.textContent = isNearSelected ? '✅ 完美！' : '✅ 已调准';
                            } else if (note.cents < -5) {
                                meterContainer.classList.add('flat');
                                noteText.classList.remove('in-tune');
                                statusText.textContent = '📉 偏低，请拧紧琴弦';
                            } else if (note.cents > 5) {
                                meterContainer.classList.add('sharp');
                                noteText.classList.remove('in-tune');
                                statusText.textContent = '📈 偏高，请放松琴弦';
                            }
                        }
                    } else {
                        lowSignalCount++;
                        if (lowSignalCount > 20) {
                            noteText.textContent = '--';
                            noteText.classList.remove('in-tune');
                            freqText.textContent = '声音太弱或不稳定';
                            meterFill.style.width = '50%';
                            meterContainer.classList.remove('fine', 'flat', 'sharp');
                            statusText.textContent = '请弹奏琴弦';
                        }
                    }
                    animFrame = requestAnimationFrame(update);
                }
                update();
            } catch (err) {
                console.error('麦克风错误:', err.name, err.message);
                stopListening();

                switch (err.name) {
                    case 'NotAllowedError':
                        showError('permission-denied', err.message);
                        break;
                    case 'NotFoundError':
                        showError('not-found');
                        break;
                    case 'AbortError':
                        showError('abort');
                        break;
                    case 'NotReadableError':
                        showError('default', '麦克风被其他应用占用');
                        break;
                    default:
                        showError('default', `${err.name}: ${err.message}`);
                }
                statusText.textContent = '无法获取麦克风';
            }
        }

        async function stopListening() {
            if (animFrame) {
                cancelAnimationFrame(animFrame);
                animFrame = null;
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (audioCtx) {
                try { await audioCtx.close(); } catch (e) { /* ignore */ }
                audioCtx = null;
            }
            noteText.textContent = '--';
            noteText.classList.remove('in-tune');
            freqText.textContent = '已停止';
            meterFill.style.width = '50%';
            meterContainer.classList.remove('fine', 'flat', 'sharp');
            statusText.textContent = '已停止监听';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            hideError();
        }

        // ============ 事件绑定 ============
        startBtn.addEventListener('click', startListening);
        stopBtn.addEventListener('click', stopListening);

        // 初始检查：如果是非安全上下文，提前提示
        if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            showError('not-secure');
            statusText.textContent = '需要 HTTPS 才能使用麦克风';
        } else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError('not-supported');
            statusText.textContent = '浏览器不支持麦克风 API';
        }
    })();
    </script>
</body>
</html>
